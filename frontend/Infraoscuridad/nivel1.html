<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Infraoscuridad - Nivel 1</title>
  <link rel="stylesheet" href="/static/css/estilos.css">
  <script src="/static/js/biomas.js"></script>
  <script src="/static/js/infra_ciudades.js"></script>
  <script type="module" src="/static/js/nivel_base.js"></script>
  <style>
    /* Estilos adicionales para ciudades */
    .ciudad {
      position: absolute;
      width: 32px;
      height: 32px;
      background-image: url("/static/iconos/ciudad.png");
      background-size: cover;
      cursor: pointer;
      z-index: 10;
    }
    #mapa {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #111;
    }
  </style>
</head>
<body>
  <h1 style="color: white; text-align: center;">Infraoscuridad - Nivel 1</h1>
  <div id="mapa"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Generar mapa base
      generarMapaInfraoscuridad(1);

      // Colocar ciudades
      infraCiudadesNivel1.forEach(ciudad => {
        const marker = document.createElement("div");
        marker.className = "ciudad";
        marker.style.left = ciudad.x + "px";
        marker.style.top = ciudad.y + "px";
        marker.title = ciudad.nombre;
        marker.addEventListener("click", () => {
          alert("Has entrado en la ciudad: " + ciudad.nombre);
          // Aquí se podría redirigir a su submapa
        });
        document.getElementById("mapa").appendChild(marker);
      });
    });
  </script>
</body>
</html>
