<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Infraoscuridad - Nivel 2</title>
  <style>
    body {
      margin: 0;
      background-color: #0f0f0f;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      position: absolute;
      z-index: 1;
    }
    #visor {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }
    #iconos {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    .etiqueta {
      position: absolute;
      transform: translate(-50%, -100%);
      color: #dddddd;
      font-size: 12px;
      background-color: rgba(10, 10, 10, 0.6);
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
    }
    #iconos img {
      pointer-events: auto;
      user-select: none;
      width: 64px;
      height: 64px;
      position: absolute;
      user-drag: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <canvas id="mapa"></canvas>
  <div id="visor"></div>
  <div id="iconos"></div>

  <script>
    window.NIVEL_ACTUAL = 2;
  </script>
  <script type="module" src="/static/js/nivel_base.js"></script>
</body>
</html>
