<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Infraoscuridad - Nivel 3</title>
  <style>
    body {
      margin: 0;
      background: #0e0e0e url('../assets/mapas/infraoscuridad/nivel3_base.jpg') no-repeat center center;
      background-size: cover;
      overflow: hidden;
    }

    #visor {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 3000px;
      height: 3000px;
      display: grid;
      grid-template-columns: repeat(auto-fill, 512px);
      grid-auto-rows: 256px;
      pointer-events: none;
    }

    .tile {
      width: 512px;
      height: 512px;
      pointer-events: auto;
      position: relative;
    }

    .tile img {
      width: 512px;
      height: 512px;
      image-rendering: pixelated;
    }

    #selector-nivel {
      position: fixed;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(15, 15, 15, 0.85);
      border: 2px solid #333;
      padding: 10px;
      border-radius: 8px;
    }

    #selector-nivel button {
      background: #1c1c1c;
      color: #0ff;
      border: 1px solid #0ff;
      padding: 6px 10px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    #selector-nivel button:hover {
      background: #0ff;
      color: #000;
    }
  </style>
</head>
<body>

<div id="visor">
  <!-- Aquí se insertarán tiles isométricos -->
  <div class="tile"><img src="../assets/tiles/suelo/suelo3.png" alt="tile"></div>
</div>

<div id="selector-nivel">
  <button onclick="irANivel('nivel3.html')">⬆ Nivel 3</button>
  <button onclick="irANivel('nivel2.html')">⬆ Nivel 2</button>
  <button onclick="irANivel('nivel1.html')">⬆ Nivel 1</button>
</div>

<script>
  function irANivel(nivel) {
    window.location.href = nivel;
  }
</script>

</body>
</html>
