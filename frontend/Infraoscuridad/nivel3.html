<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Infraoscuridad – Nivel 3 (Vista Isométrica)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #mapa {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #111;
    }

    .tile {
      position: absolute;
      width: 512px;
      height: 512px;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .editor-tile {
      pointer-events: auto;
      cursor: move;
    }

    #toolbar {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.8);
      padding: 8px;
      border-radius: 8px;
    }

    .btn-tile {
      width: 64px;
      height: 64px;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      background-color: #222;
    }

    .btn-tile.selected {
      border-color: #0ff;
    }

    #btn-guardar {
      background: #0f0;
      color: #000;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    #btn-borrar {
      background: #f00;
      color: #fff;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <img src="../assets/tiles/suelo/piedraOscura.png" class="btn-tile selected" data-src="../assets/tiles/suelo/piedraOscura.png">
    <img src="../assets/tiles/ciudades/ruinasAntiguas.png" class="btn-tile" data-src="../assets/tiles/ciudades/ruinasAntiguas.png">
    <img src="../assets/tiles/entradas/pozoMagico.png" class="btn-tile" data-src="../assets/tiles/entradas/pozoMagico.png">
    <button id="btn-guardar">💾 Guardar</button>
    <button id="btn-borrar">🗑️ Borrar todo</button>
  </div>

  <div id="mapa"></div>

  <script>
    const mapa = document.getElementById("mapa");
    const tileButtons = document.querySelectorAll(".btn-tile");
    let tileSeleccionado = "../assets/tiles/suelo/piedraOscura.png";

    tileButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        tileButtons.forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        tileSeleccionado = btn.dataset.src;
      });
    });

    mapa.addEventListener("click", (e) => {
      const x = e.clientX - 256;
      const y = e.clientY - 256;

      const tile = document.createElement("img");
      tile.src = tileSeleccionado;
      tile.className = "tile editor-tile";
      tile.style.left = x + "px";
      tile.style.top = y + "px";
      tile.draggable = true;

      tile.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", null);
        e.target.dataset.offsetX = e.offsetX;
        e.target.dataset.offsetY = e.offsetY;
      });

      tile.addEventListener("dragend", e => {
        const offsetX = parseInt(e.target.dataset.offsetX);
        const offsetY = parseInt(e.target.dataset.offsetY);
        e.target.style.left = (e.clientX - offsetX) + "px";
        e.target.style.top = (e.clientY - offsetY) + "px";
      });

      mapa.appendChild(tile);
      guardarTiles();
    });

    function guardarTiles() {
      const tiles = Array.from(document.querySelectorAll(".tile")).map(t => ({
        src: t.src,
        left: t.style.left,
        top: t.style.top
      }));
      localStorage.setItem("infra_nivel3_tiles", JSON.stringify(tiles));
    }

    function cargarTiles() {
      const data = JSON.parse(localStorage.getItem("infra_nivel3_tiles") || "[]");
      data.forEach(d => {
        const tile = document.createElement("img");
        tile.src = d.src;
        tile.className = "tile editor-tile";
        tile.style.left = d.left;
        tile.style.top = d.top;
        tile.draggable = true;

        tile.addEventListener("dragstart", e => {
          e.dataTransfer.setData("text/plain", null);
          e.target.dataset.offsetX = e.offsetX;
          e.target.dataset.offsetY = e.offsetY;
        });

        tile.addEventListener("dragend", e => {
          const offsetX = parseInt(e.target.dataset.offsetX);
          const offsetY = parseInt(e.target.dataset.offsetY);
          e.target.style.left = (e.clientX - offsetX) + "px";
          e.target.style.top = (e.clientY - offsetY) + "px";
          guardarTiles();
        });

        mapa.appendChild(tile);
      });
    }

    document.getElementById("btn-guardar").onclick = guardarTiles;
    document.getElementById("btn-borrar").onclick = () => {
      localStorage.removeItem("infra_nivel3_tiles");
      location.reload();
    };

    cargarTiles();
  </script>
</body>
</html>
