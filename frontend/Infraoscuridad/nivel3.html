<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Infraoscuridad - Nivel 3</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }
    canvas {
      display: block;
      background-color: #000;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const tileWidth = 64;
  const tileHeight = 32;
  const mapWidth = 20;
  const mapHeight = 20;

  let scale = 1;
  let offsetX = canvas.width / 2;
  let offsetY = 100;

  const terrain = ["#111", "#1a1a1a", "#222"];

  function drawTile(x, y, color) {
    const isoX = (x - y) * tileWidth / 2 * scale + offsetX;
    const isoY = (x + y) * tileHeight / 2 * scale + offsetY;

    ctx.beginPath();
    ctx.moveTo(isoX, isoY);
    ctx.lineTo(isoX + tileWidth / 2 * scale, isoY + tileHeight / 2 * scale);
    ctx.lineTo(isoX, isoY + tileHeight * scale);
    ctx.lineTo(isoX - tileWidth / 2 * scale, isoY + tileHeight / 2 * scale);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.stroke();
  }

  function drawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < mapHeight; y++) {
      for (let x = 0; x < mapWidth; x++) {
        const color = terrain[(x + y) % terrain.length];
        drawTile(x, y, color);
      }
    }
  }

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.1 : 0.9;
    scale *= delta;
    drawMap();
  });

  drawMap();
</script>
</body>
</html>
